[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route /api/telegram-notify and /api/notify to the Netlify Function
[[redirects]]
  from = "/api/telegram-notify"
  to = "/.netlify/functions/telegram-notify"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/telegram-notify"
  status = 200

# SPA fallback — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
